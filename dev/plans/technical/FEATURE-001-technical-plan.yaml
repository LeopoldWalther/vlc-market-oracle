    - id: "3.2"
      title: "Fetch a detail page only for a listing id never seen before"
      description: |
        The single largest cost saving in the design. A listing's attributes do not change after
        publication and the only moving value - the price - is already on the card, together with
        the previous price and the drop percentage. The known-id set is rebuilt from the stored
        detail records rather than a side state file, so a lost file cannot cause silent gaps or
        duplicate spending.

        Review finding M8: selection runs per page, through task 3.1's callback, so a page's detail
        pages are fetched before the next search page. Selection itself stays a pure set difference
        and needs no fetcher to test.
