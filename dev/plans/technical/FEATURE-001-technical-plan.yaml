        - "Selection follows page order, so earlier search pages are captured first"
        - "The remaining 6 ids are still selected on the following run"
        - "The run report records the backlog size before and after the run"
        - "CARRIED OVER FROM 2.3: the run budget comes from credit_ledger.binding_budget, so the
          monthly remainder can bind instead of the per-run budget"
