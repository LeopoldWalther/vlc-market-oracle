    - id: "4.4"
      title: "Validate end to end with one bounded live run and a free replay"
      description: |
        The proof the user asked for before considering a paid plan. One deliberately tiny live run,
        then a replay of the same data at zero credits. Record the observed numbers in the feature
        plan and calibrate the coverage thresholds from the real run rather than from a guess.
        SPENDS LIVE CREDITS - requires the user's explicit go-ahead.
      status: "not_started"
      complexity: "low"
      estimated_hours: 1
      depends_on: ["4.3"]
      branch: "feature/region-listing-crawl/4.4-bounded-live-validation"
      commit_message: "docs: record the bounded live validation run for FEATURE-001"
      acceptance_criteria:
        - "A run with --max-pages 1 --max-listings 10 against L'Eliana produces observations, details and a run report"
        - "The credits spent in that run match the report's counter"
        - "A subsequent --replay run reproduces identical records with zero network calls"
        - "Coverage thresholds are calibrated from the observed fill rates and committed"
        - "The feature plan's progress log records the run, the credits spent and the resulting thresholds"
        - "Every success criterion of the feature plan is checked off or explicitly explained"
      tdd: null
      validation_commands:
