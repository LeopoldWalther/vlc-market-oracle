    - id: "4.3"
      title: "Expose the crawl as a bounded command line entry point"
      description: |
        One entry point with every kill switch the plan requires, and the composition root where the
        fetcher, parsers, writer and ledger are wired. Folding the single-URL script into the shared
        path removes the second collection route.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["3.4", "4.1", "4.2", "2.2"]
      branch: "feature/region-listing-crawl/4.3-collect-region-cli"
      commit_message: "feat(idealista): add the bounded collect-region command line entry point"
      acceptance_criteria:
        - "Arguments --target, --max-pages, --max-listings, --cards-only, --credit-budget, --monthly-budget, --replay, --no-js-render and --dry-run are parsed"
        - "--dry-run provably triggers no fetch and no write"
        - "--replay wires CachedHtmlFetcher so the run spends zero credits"
        - "A failed coverage threshold makes the process exit non-zero; a budget stop does not"
        - "The API key is read from the environment only and never appears in logs or output"
        - "src/scrape_listing_zenrows.py is folded into this path or removed, and no test references it afterwards"
      tdd:
