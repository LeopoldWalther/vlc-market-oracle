    - id: "4.2"
      title: "Load search targets from configuration"
      description: |
        Adding an area must be a configuration line, not a code change - that is what makes the
        agreed expansion path (L'Eliana first, then Valencia one district at a time) cheap.

        Review finding M9: use DISTRICT URLs for Valencia, /venta-viviendas/valencia/<district>/,
        not neighbourhood URLs. Valencia city holds 5,462 sale listings and its largest district
        553, far below the 1,800 cap, so ~19 district targets cover the city where ~70 neighbourhood
        targets would be needed. Keep the neighbourhood form
        /venta-viviendas/valencia/<district>/<neighbourhood>/ as a commented fallback for the day a
        district passes the cap. Both differ from the municipality form
        /venta-viviendas/l-eliana-valencia/.

        Area discovery stays a manual browser step and costs no credits: the municipality index
        /venta-viviendas/valencia-provincia/municipios and the zone indexes
        /venta-viviendas/valencia-valencia/mapa and /venta-viviendas/valencia/<district>/mapa list
        every area with its listing count. Record that count per target as expected_listings so a
        run returning far fewer observations is visible as drift.

        Ship L'Eliana sale (/venta-viviendas/l-eliana-valencia/, expected_listings 215) and rent
        (/alquiler-viviendas/l-eliana-valencia/, expected_listings 42). Every target is requested
        with the recency sort, the bare query ?fecha-publicacion-desc, so page order equals recency
        for task 3.4.
