    - id: "3.4"
      title: "Stage the initial backfill across months by priority"
      description: |
        The confirmed volumes are 215 sale and 42 rent listings, so the backfill is 257 details or
        ~6,425 credits with js_render enabled, which does not fit in one 5,000-credit month. Fetch
        details up to whatever the per-run and monthly budgets allow and carry the remainder to the
        next run, so the backfill completes automatically over about two Free months instead of
        requiring a paid plan up front.

        Review finding M8: because pages are processed as units, the priority order is page order.
        The recency sort is confirmed as the bare query ?fecha-publicacion-desc, so requesting
        targets with it makes page order genuinely newest-first. The ordering stays a pure function
        over the backlog.
