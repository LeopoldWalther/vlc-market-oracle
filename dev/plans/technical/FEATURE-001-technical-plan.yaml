        - "Each request adds 25 credits with js_render and 10 without to the run counter"
        - "A budget of N credits permits exactly N // cost_per_request requests, then stops"
        - "The stop is controlled: stopped_reason is 'credit_budget_exhausted' and the process does not exit with an error"
        - "429, 5xx and the transient ZenRows 422/RESP001 are retried with bounded backoff and jitter; 404/RESP002 is a zero-result fact and any other 4xx is not retried"
        - "Requests are issued sequentially with a configurable pause; no thread pool is introduced"
        - "The existing 6 tests in tests/test_zenrows_source.py stay green"
      tdd:
        red:
          test_file: "tests/test_fetch_budget.py"
