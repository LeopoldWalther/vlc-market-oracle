    - id: "4.1"
      title: "Write records idempotently in the layout FEATURE-002 expects"
      description: |
        Review finding M1: the plan asserts idempotency as an invariant and a success criterion but
        names no output format, path or writer. Use newline-delimited JSON under the same table
        names and the same observed_date partitioning FEATURE-002 defines for S3, so the later
        BronzeSink is a substitution rather than a migration:

          data/bronze/idealista/<table>/operation=<sale|rent>/observed_date=YYYY-MM-DD/<target>.jsonl

        Tables: listing_observations, listing_details, quarantine, runs. The dedup key is
