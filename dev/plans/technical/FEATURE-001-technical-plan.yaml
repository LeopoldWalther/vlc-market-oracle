          command: "python -m unittest discover -s tests -t . -p 'test_region_crawler.py' -v"
        refactor:
          rule: "Keep the crawler free of parsing and of HTTP details; it composes parsers and a fetcher"
          command: "python -m unittest discover -s tests -t . -p 'test_region_crawler.py' -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -p 'test_region_crawler.py' -v"
      allowed_files:
