        - "config/search_targets.yaml"
      forbidden_files:
        - "src/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the task commit; spent credits are not recoverable"
      files_to_create: []
      files_to_modify:
        - "dev/plans/FEATURE-001-region-listing-crawl.md"
        - "dev/plans/README.md"
        - "config/search_targets.yaml"

  git_workflow:
    base_branch: "main"
    branch_from: |
      A task with no dependencies branches from main. A dependent task branches from the branch of
      its last completed dependency, so the ancestry follows the dependency graph and no task has to
      invent a merge order. Where a task has several dependencies, branch from the one latest on the
      critical path and merge the others in first.
    integration: |
      Merge each task branch into the next dependent task's branch as it completes. Independent
      chains (0.1, 0.2; 1.3/1.4, 1.5, 1.6; 2.2, 2.3) merge back into the feature integration branch
      feature/region-listing-crawl before task 4.3, which is the first task that needs everything.
    commit_policy: |
      One focused commit per task using the task's commit_message. No feature work mixed with
      unrelated refactors or formatting. Never commit anything under data/ (gitignored) and never a
      fixture containing an agency name, phone number or email address.
    pull_request:
      title: "FEATURE-001: region-wide Idealista collection with drift-resistant extraction"
      base: "main"
      body_references:
        - "dev/plans/FEATURE-001-region-listing-crawl.md"
        - "dev/reviews/REVIEW-FEATURE-001.md"
      checklist:
        - "python -m unittest discover -s tests -t . -v passes"
        - "python dev/tools/validate_workflow.py passes"
        - "No secrets, personal data or files under data/ are included"
        - "Statuses in the feature plan, the plans README and this technical plan agree"

  notes:
    - "Tasks 0.3 and 4.4 are the only ones that touch the live portal. Both spend credits from a
      5,000-credit monthly allowance that does not roll over, and both need the user's explicit
      go-ahead before execution."
    - "Task 0.3 is not a blocker for parser work: a search page saved from the browser is a valid
      fixture source and costs nothing. Only the js_render decision needs the live comparison."
    - "Compare id sets, never HTML length, when judging whether a fetch succeeded. Idealista is
      behind Datadome and a block arrives as HTTP 200 with a challenge body."
    - "Fetching is sequential by decision (review finding M6). Do not add a thread pool; if a run
      becomes too slow, that is a separate, additive change with its own evidence."
    - "The local output layout in task 4.1 deliberately mirrors the S3 layout of FEATURE-002. If
      that plan's layout changes, change task 4.1 with it."
    - "Keep derived values out of Bronze: no price_per_sqm, no first_seen, no days_on_market. They
      belong in Silver, where facts and derivations stay separated."
    - "OPEN, CARRIED OVER FROM TASK 2.3: the criterion 'the stop sets stopped_reason and writes a
      partial report' could not be met inside 2.3. CrawlReport has no stopped_reason field and
      models.py is outside that task's allowed_files, so 2.3 delivers only the pure ledger and the
      binding_budget decision. Task 3.3 adds the field and records it; task 3.4 wires the monthly
      remainder into the run. The item stays open until both are done."
