        - "It still forbids authentication bypass and any account-only or paid-API data"
        - "No sentence in README.md contradicts the 'Scraping Rules' section of .github/copilot-instructions.md"
        - "The 'Current repository state' section no longer presents the browser notebooks as the collection path"
      tdd: null
      validation_commands:
        - "python dev/tools/validate_workflow.py"
      allowed_files:
