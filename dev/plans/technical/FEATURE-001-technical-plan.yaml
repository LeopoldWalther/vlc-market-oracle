    - id: "2.1"
      title: "Fetch sequentially with retries, credit accounting and a per-run budget"
      description: |
        Introduce the narrow HtmlFetcher protocol so the crawler can be tested without network and
        FEATURE-003 can substitute an implementation, and extend the ZenRows adapter with credit
        accounting and a per-run budget stop.

        Review finding M6: fetching is SEQUENTIAL with a configurable pause. The starting scope is
        ~12 search pages per pass and at most ~148 detail pages per month; a thread pool is
        speculative complexity here and works against the required human-like pacing. Adding
        concurrency later is contained and additive.
      status: "done"
      complexity: "medium"
      estimated_hours: 2
      depends_on: ["1.1"]
