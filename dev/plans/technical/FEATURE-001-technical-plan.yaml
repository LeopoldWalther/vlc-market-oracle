    - id: "3.1"
      title: "Paginate a search target, processing one page as a complete unit"
      description: |
        The orchestration core: follow li.next from page 1, deduplicate listing ids across pages,
        and stop at max_pages or at the 60-page cap. Driven by a FakeHtmlFetcher over the fixture
        pages, so no test touches the live portal.

        Review finding M8: a page is processed end to end before the next page is fetched - parse
        the cards, hand them to a per-page callback, then follow li.next. The callback seam is what
        lets task 3.2 fetch that page's detail pages and task 4.1 write its records, so a budget
        stop or a crash leaves a consistent prefix instead of a half-written run, and memory stays
        bounded regardless of area size. Note the numeric page list is a sliding window (observed as
        1..6, 47..51, 55..60), so the last page number cannot be read from page 1; li.next is the
        only correct signal.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 2
      depends_on: ["1.4", "2.1"]
      branch: "feature/region-listing-crawl/3.1-paginate-search-target"
      commit_message: "feat(idealista): paginate a search target into deduplicated observations"
      acceptance_criteria:
        - "A FakeHtmlFetcher serving 3 fixture pages produces the union of their observations"
        - "An id appearing on two pages yields exactly one observation for the run"
        - "max_pages stops the crawl and the fetcher records no request beyond the limit"
        - "Reaching page 60 sets page_cap_reached for that target in the run report"
        - "The per-page callback is invoked once per page, in page order, before the next page is fetched"
        - "Raw HTML is persisted before parsing for every fetched page"
        - "The crawler depends on the HtmlFetcher protocol, never on ZenRows directly"
