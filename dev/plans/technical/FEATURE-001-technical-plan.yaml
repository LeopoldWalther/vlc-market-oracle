    - id: "0.3"
      title: "Capture search-page evidence and commit reduced fixtures"
      description: |
        Answer the three spike questions and produce the fixtures Phase 1 needs. Review finding M3:
        the fixture and the live spike are deliberately decoupled. The fixture may come from the
        browser (save the page, or copy document.documentElement.outerHTML from DevTools) at zero
        credits, and that HTML is the more trustworthy source for selector work. The live requests
        answer only what a browser cannot.

        Live part, 4 requests, ~100 of 5,000 monthly credits, REQUIRES THE USER'S EXPLICIT
        GO-AHEAD: L'Eliana sale page 1 with js_render, the same page without js_render, sale page 2,
        rent page 1. Compare the sets of data-element-id values, not the HTML length - a block
        arrives as HTTP 200. Store every payload under data/raw/idealista/search/ before analysing.

        Committed fixtures are reduced, not whole pages (review finding L2): the
        section.items-container subtree with three or four cards plus the pagination block, with
        agency and contact markup stripped. Note span.highlighted-text ("Top", "Destacado") sits
        OUTSIDE and before the article, so the card selector must not swallow it.

        One question must be settled from the captured HTML (review finding M8 caveat): the recency
        sort is the bare query ?fecha-publicacion-desc, confirmed on
        /alquiler-viviendas/l-eliana-valencia/. Check whether the li.next href on a sorted page
        carries that query. If it does not, the crawler must re-apply the sort to every page URL it
        builds, otherwise page 2 silently returns relevance order - plausible-looking wrong data.
        Record the answer in the feature plan's progress log together with the js_render decision
        and the confirmed no-results marker text for task 1.4. Volumes are already authoritative:
        215 sale and 42 rent listings, 8 + 2 = 10 search pages.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1
      depends_on: ["0.2"]
      branch: "feature/region-listing-crawl/0.3-search-page-evidence"
      commit_message: "test: add reduced Idealista search page fixtures from captured evidence"
      acceptance_criteria:
        - "tests/fixtures/idealista_search_page.html holds at least 3 article.item[data-element-id] cards and the div.pagination block"
        - "tests/fixtures/idealista_search_page_last.html has no li.next entry"
        - "tests/fixtures/idealista_search_page_empty.html carries the real no-results marker and zero cards"
        - "tests/fixtures/idealista_search_page_challenge.html is a captured Datadome challenge, or a minimal stand-in if none was served"
        - "No fixture contains an agency name, phone number, email address or personal identifier"
        - "The feature plan's progress log records the js_render answer, the no-results marker and the real result counts per operation"
        - "Raw captures live under data/raw/idealista/search/ and are not committed (/data/* is gitignored)"
      tdd: null
      validation_commands:
        - "grep -c 'data-element-id' tests/fixtures/idealista_search_page.html"
        - "grep -ciE 'telefono|tel:|@|agencia|profesional' tests/fixtures/idealista_search_page*.html"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "tests/fixtures/idealista_search_page.html"
        - "tests/fixtures/idealista_search_page_last.html"
        - "tests/fixtures/idealista_search_page_empty.html"
        - "tests/fixtures/idealista_search_page_challenge.html"
        - "dev/plans/FEATURE-001-region-listing-crawl.md"
      forbidden_files:
        - "src/**"
        - "data/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the task commit; credits already spent on the live captures are not recoverable"
      files_to_create:
        - "tests/fixtures/idealista_search_page.html"
        - "tests/fixtures/idealista_search_page_last.html"
        - "tests/fixtures/idealista_search_page_empty.html"
        - "tests/fixtures/idealista_search_page_challenge.html"
      files_to_modify:
        - "dev/plans/FEATURE-001-region-listing-crawl.md"

    - id: "1.1"
      title: "Define the crawl value objects"
      description: |
        Frozen dataclasses for SearchTarget, ListingObservation, ListingDetail and CrawlReport.
        They validate at construction and are the join surface between parsers, crawler, writer and
        FEATURE-002. price_per_sqm is deliberately absent: it is derived and belongs in Silver.
        Money stays an int in euros; price_drop_pct is a float because it is a ratio, not money.

        Review finding L5: the card carries a relative freshness badge ("6 horas", "21 horas").
        Store it verbatim as the nullable string freshness_label. It is the only signal that can
        date a listing published before collection started, so it closes the time-on-market cold
        start - but its exact meaning (published or updated) is unestablished, so Bronze stores the
        raw text and never interprets it.
      status: "done"
      complexity: "low"
      estimated_hours: 1
      depends_on: ["0.2"]
      branch: "feature/region-listing-crawl/1.1-crawl-value-objects"
      commit_message: "feat(idealista): add crawl value objects for observations and details"
      acceptance_criteria:
        - "ListingObservation carries listing_id, listing_url, operation, municipality, district, price_eur, prev_price_eur, price_drop_pct, sqm_built, rooms, freshness_label and observed_at"
        - "freshness_label is an optional raw string and is never parsed into a duration in Bronze"
        - "A blank listing_id or a negative price_eur raises ValueError naming the field"
        - "observed_at is timezone-aware UTC; a naive datetime raises ValueError"
        - "SearchTarget rejects an operation outside {sale, rent}"
        - "All four records are frozen and cannot be mutated after construction"
      tdd:
        red:
          test_file: "tests/test_crawl_models.py"
          command: "python -m unittest discover -s tests -t . -p 'test_crawl_models.py' -v"
          expected_failure: "ModuleNotFoundError: no module named 'src.idealista.models'"
        green:
          behavior: "Add frozen dataclasses with __post_init__ validation raising ValueError per field"
          command: "python -m unittest discover -s tests -t . -p 'test_crawl_models.py' -v"
        refactor:
          rule: "Extract a shared validation helper only if three or more fields repeat the same check"
          command: "python -m unittest discover -s tests -t . -p 'test_crawl_models.py' -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -p 'test_crawl_models.py' -v"
      allowed_files:
        - "src/idealista/models.py"
        - "tests/test_crawl_models.py"
      forbidden_files:
        - "src/idealista/listing_parser.py"
        - "src/idealista/zenrows_source.py"
      can_run_parallel_with: ["1.2"]
      reversible: true
      rollback: "Revert the task commit; no consumer exists yet"
      files_to_create:
        - "src/idealista/models.py"
        - "tests/test_crawl_models.py"
      files_to_modify: []

    - id: "1.2"
      title: "Resolve fields through an ordered selector registry"
      description: |
        A pure resolver that takes an ordered list of candidate CSS selectors and returns the first
        match together with the name of the selector that matched, so drift is attributable. A field
        with no match returns None and is recorded in missing_fields. This is the mechanism that
        turns a layout change from a code change into a data change.
      status: "not_started"
      complexity: "low"
      estimated_hours: 1
      depends_on: ["0.2"]
      branch: "feature/region-listing-crawl/1.2-selector-registry"
      commit_message: "feat(idealista): resolve fields through an ordered selector registry"
      acceptance_criteria:
        - "resolve_field returns the text of the first matching selector and that selector's identifier"
        - "With no matching selector it returns None and the caller can record the field as missing"
        - "The registry is plain data: adding a fallback requires no code change"
        - "The resolver performs no network or filesystem access"
      tdd:
        red:
          test_file: "tests/test_selectors.py"
          command: "python -m unittest discover -s tests -t . -p 'test_selectors.py' -v"
          expected_failure: "ModuleNotFoundError: no module named 'src.idealista.selectors'"
        green:
          behavior: "Implement resolve_field over a BeautifulSoup tree plus the registry mapping"
          command: "python -m unittest discover -s tests -t . -p 'test_selectors.py' -v"
        refactor:
          rule: "Keep the registry and the resolver in one module while it stays under ~120 lines"
          command: "python -m unittest discover -s tests -t . -p 'test_selectors.py' -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -p 'test_selectors.py' -v"
      allowed_files:
        - "src/idealista/selectors.py"
        - "tests/test_selectors.py"
      forbidden_files:
        - "src/idealista/listing_parser.py"
      can_run_parallel_with: ["1.1"]
      reversible: true
      rollback: "Revert the task commit; nothing consumes the registry until task 1.3"
      files_to_create:
        - "src/idealista/selectors.py"
        - "tests/test_selectors.py"
      files_to_modify: []

    - id: "1.3"
      title: "Parse a search results page into listing observations"
      description: |
        Turn one search page into ListingObservation records plus the next page URL and the total
        result count. The listing id comes from article.item[data-element-id]; review finding L1
        requires the parser to also read the id out of the a.item-link href and to report a mismatch
        as drift rather than silently preferring one source. Cards carry price, struck-through
        previous price, drop percentage, rooms and size.

        Two details from the captured pages: div.item-detail-char reads like
        "Garaje incluido 4 hab. 223 m2", so the first token is not always numeric and parsing must
        match on unit keywords rather than on position. Review finding L5: capture the card's
        relative freshness badge verbatim into freshness_label when present, and leave it None when
        absent - most cards do not carry one.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 2
      depends_on: ["1.1", "1.2", "0.3"]
      branch: "feature/region-listing-crawl/1.3-search-page-parser"
      commit_message: "feat(idealista): parse search result cards into listing observations"
      acceptance_criteria:
        - "Every article.item[data-element-id] in the fixture yields one ListingObservation"
        - "listing_id comes from data-element-id and equals the id parsed from the a.item-link href"
        - "A mismatch between the two id sources is reported as drift, not silently resolved"
        - "price_eur, sqm_built and rooms are parsed from the card as ints"
        - "rooms and size are matched by unit keyword, so a leading non-numeric feature such as 'Garaje incluido' does not shift them"
        - "A card with a freshness badge yields its raw text in freshness_label; a card without one yields None"
        - "next_page_url is the absolute URL derived from li.next > a[href] and preserves the sort query of the requested page"
        - "The total result count from the page header is returned alongside the observations"
        - "The parser performs no network access and takes HTML plus the search target as arguments"
      tdd:
        red:
          test_file: "tests/test_search_page_parser.py"
          command: "python -m unittest discover -s tests -t . -p 'test_search_page_parser.py' -v"
          expected_failure: "ModuleNotFoundError: no module named 'src.idealista.search_page_parser'"
        green:
          behavior: "Implement parse_search_page returning observations, next_page_url and result_count"
          command: "python -m unittest discover -s tests -t . -p 'test_search_page_parser.py' -v"
        refactor:
          rule: "Move every literal selector into src/idealista/selectors.py; the tests stay green"
          command: "python -m unittest discover -s tests -t . -p 'test_search_page_parser.py' -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -p 'test_search_page_parser.py' -v"
        - "python -m unittest discover -s tests -t . -p 'test_selectors.py' -v"
      allowed_files:
        - "src/idealista/search_page_parser.py"
        - "src/idealista/selectors.py"
        - "tests/test_search_page_parser.py"
      forbidden_files:
        - "src/idealista/zenrows_source.py"
        - "src/idealista/models.py"
      can_run_parallel_with: ["1.5", "1.6"]
      reversible: true
      rollback: "Revert the task commit; the crawler does not exist yet"
      files_to_create:
        - "src/idealista/search_page_parser.py"
        - "tests/test_search_page_parser.py"
      files_to_modify:
        - "src/idealista/selectors.py"

    - id: "1.4"
      title: "Separate an empty search area from a blocked page"
      description: |
        Review finding M4, the most consequential correction in this plan. A Datadome challenge and
        a genuinely empty area both return HTTP 200 with zero cards; as originally specified the
        crawler would record a block as "this area has no listings" and report a healthy run.
        Make validity positive: a page is a valid search page only if it carries at least one
        article.item[data-element-id] OR the explicit no-results marker. Anything else is rejected
        for quarantine and counted as an error. Also covers the last page, a card without a price
        reduction, and the 60-page cap.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["1.3"]
      branch: "feature/region-listing-crawl/1.4-search-page-validity"
      commit_message: "feat(idealista): reject blocked search pages instead of reading them as empty"
      acceptance_criteria:
        - "The last-page fixture returns next_page_url None and does not raise"
        - "The empty-result fixture returns zero observations and is treated as a valid page"
        - "The challenge fixture raises SearchPageRejected naming the reason; it is never reported as an empty area"
        - "A card without a price reduction yields prev_price_eur None and price_drop_pct None"
        - "The page cap is a parameter defaulting to 60, so the test proves the stop with 3 pages"
        - "Reaching the cap is reported as page_cap_reached for that target rather than silently truncating"
      tdd:
        red:
          test_file: "tests/test_search_page_validity.py"
          command: "python -m unittest discover -s tests -t . -p 'test_search_page_validity.py' -v"
          expected_failure: "ImportError: SearchPageRejected is not defined in src.idealista.search_page_parser"
        green:
          behavior: "Add the positive validity check, SearchPageRejected, and the configurable page cap"
          command: "python -m unittest discover -s tests -t . -p 'test_search_page_validity.py' -v"
        refactor:
          rule: "Keep the no-results marker in the selector registry so a wording change is a data edit"
          command: "python -m unittest discover -s tests -t . -p 'test_search_page*.py' -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -p 'test_search_page*.py' -v"
      allowed_files:
        - "src/idealista/search_page_parser.py"
        - "src/idealista/selectors.py"
        - "tests/test_search_page_validity.py"
      forbidden_files:
        - "src/idealista/listing_parser.py"
      can_run_parallel_with: ["1.5", "1.6"]
      reversible: true
      rollback: "Revert the task commit; task 1.3 behavior remains intact"
      files_to_create:
        - "tests/test_search_page_validity.py"
      files_to_modify:
        - "src/idealista/search_page_parser.py"
        - "src/idealista/selectors.py"

    - id: "1.5"
      title: "Move detail extraction onto the registry and enforce required fields"
      description: |
        Today listing_parser.py uses fixed single selectors and turns every miss into None, so a
        renamed class produces a silently incomplete record. Move field resolution onto the registry
        with fallbacks, record missing_fields, and reject a record that lacks listing_id, price_eur
        or sqm_built instead of writing it. Drop price_per_sqm (derived, and a float where money
        must not be); add operation, municipality, district, observed_at and extraction_version.
        The 8 existing parser tests must stay green through the refactor.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 2
      depends_on: ["1.1", "1.2"]
      branch: "feature/region-listing-crawl/1.5-detail-parser-registry"
      commit_message: "feat(idealista): resolve detail fields via the registry and reject incomplete records"
      acceptance_criteria:
        - "A fixture with the primary price class renamed is parsed correctly through the fallback selector"
        - "A fixture with every price selector removed raises ListingRejected naming price_eur"
        - "A parsed record reports missing_fields for every field no selector matched"
        - "price_per_sqm no longer exists on the record; operation, municipality, district, observed_at and extraction_version do"
        - "tests/test_idealista_listing_parser.py still passes, adjusted only where the contract deliberately changed"
      tdd:
        red:
          test_file: "tests/test_listing_parser_drift.py"
          command: "python -m unittest discover -s tests -t . -p 'test_listing_parser_drift.py' -v"
          expected_failure: "AttributeError: parse_listing_html has no fallback resolution and returns None for the renamed price class"
        green:
          behavior: "Resolve each field through resolve_field and raise ListingRejected on a missing required field"
          command: "python -m unittest discover -s tests -t . -p 'test_listing_parser*.py' -v"
        refactor:
          rule: "Keep parse_features and the unit helpers unchanged; only field resolution moves"
          command: "python -m unittest discover -s tests -t . -p 'test_idealista_listing_parser.py' -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -p 'test_listing_parser_drift.py' -v"
        - "python -m unittest discover -s tests -t . -p 'test_idealista_listing_parser.py' -v"
      allowed_files:
        - "src/idealista/listing_parser.py"
        - "src/idealista/selectors.py"
        - "src/idealista/models.py"
        - "tests/test_listing_parser_drift.py"
        - "tests/test_idealista_listing_parser.py"
        - "tests/fixtures/idealista_listing_renamed_price.html"
        - "tests/fixtures/idealista_listing_no_price.html"
      forbidden_files:
        - "src/idealista/search_page_parser.py"
        - "src/scrape_listing_zenrows.py"
      can_run_parallel_with: ["1.3", "1.4", "1.6"]
      reversible: true
      rollback: "Revert the task commit; src/scrape_listing_zenrows.py keeps its current contract until task 4.3"
      files_to_create:
        - "tests/test_listing_parser_drift.py"
        - "tests/fixtures/idealista_listing_renamed_price.html"
        - "tests/fixtures/idealista_listing_no_price.html"
      files_to_modify:
        - "src/idealista/listing_parser.py"
        - "src/idealista/selectors.py"
        - "src/idealista/models.py"
        - "tests/test_idealista_listing_parser.py"

    - id: "1.6"
      title: "Fail a run whose field coverage drops below threshold"
      description: |
        Per-field fill rates across a run, with configured thresholds. Falling below one ends the
        run with a non-zero exit code and names the affected fields, so a layout change is loud
        rather than a slow erosion of the dataset. Thresholds are configuration and are calibrated
        from the first real run rather than guessed.
      status: "done"
      complexity: "low"
      estimated_hours: 1
      depends_on: ["1.1"]
      branch: "feature/region-listing-crawl/1.6-coverage-report"
      commit_message: "feat(idealista): fail a crawl run when field coverage drops below threshold"
      acceptance_criteria:
        - "A list of extraction results produces per-field coverage ratios in the CrawlReport"
        - "A breached threshold sets report.failed True and lists the affected field names"
        - "Coverage at or above every threshold leaves report.failed False"
        - "The report serializes to JSON containing requests, credits spent, pages per target, records, quarantine count and errors by category"
      tdd:
        red:
          test_file: "tests/test_crawl_report.py"
          command: "python -m unittest discover -s tests -t . -p 'test_crawl_report.py' -v"
          expected_failure: "ImportError: cannot import build_crawl_report from src.idealista.crawl_report"
        green:
          behavior: "Aggregate coverage per field, compare against thresholds, and serialize the report"
          command: "python -m unittest discover -s tests -t . -p 'test_crawl_report.py' -v"
        refactor:
          rule: "Keep report building a pure function over results; the CLI decides the exit code"
          command: "python -m unittest discover -s tests -t . -p 'test_crawl_report.py' -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -p 'test_crawl_report.py' -v"
      allowed_files:
        - "src/idealista/crawl_report.py"
        - "src/idealista/models.py"
        - "tests/test_crawl_report.py"
      forbidden_files:
