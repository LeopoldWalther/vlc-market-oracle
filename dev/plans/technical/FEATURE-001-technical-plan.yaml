    - id: "0.2"
      title: "Repair test discovery and remove the superseded browser collection path"
      description: |
        `python -m unittest discover -s tests -t .` currently fails with
        "Start directory is not importable" because tests/__init__.py is missing, and the two
        Playwright notebook test modules have been failing since the last notebook change. Removing
        both notebooks and their tests, plus the unused dev_dataclass module, leaves one collection
        path. Reproduced in an isolated copy: the result is 17 tests, OK.
      status: "done"
      complexity: "low"
      estimated_hours: 1
      depends_on: []
      branch: "feature/region-listing-crawl/0.2-repair-test-harness"
      commit_message: "chore: repair unittest discovery and drop the browser collection path"
      acceptance_criteria:
        - "`python -m unittest discover -s tests -t . -v` runs and reports 17 tests OK"
        - "Both Playwright notebooks, both notebook test modules and src/dev_dataclass.py are deleted"
        - "requirements-notebook.txt retains only what a surviving notebook needs"
        - "No remaining file imports playwright, patchright, selenium or undetected_chromedriver"
      tdd: null
      validation_commands:
