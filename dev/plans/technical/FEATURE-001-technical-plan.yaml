    - id: "3.3"
      title: "Survive individual failures and stop retrying a permanently broken listing"
      description: |
        A failure on one detail page must not end the run. Review finding M5 adds the missing bound:
        because the known-id set is rebuilt from stored detail records, a quarantined page stays
        unknown and is re-selected on every future run - self-healing for a transient block, an
        unbounded credit leak at 25 credits a try for a page that never parses. Cap the attempts and
        keep the count visible, so a systematic breakage still shows up as a spike.
